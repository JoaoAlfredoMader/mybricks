name: CI

# Every push and pull request to the two long-lived branches runs the whole check: types, lint and both suites.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: API tests (a temporary SQLite file, nothing else to start)
        run: npm test -w api
      - name: App tests with the coverage floor
        run: npm run coverage -w app
